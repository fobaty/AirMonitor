name: CI & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build-firmware:
    name: Build ESP32-S3 Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install toolchain and ESP-IDF via espup
        run: |
          cargo install espup
          espup install
          cargo install ldproxy
          cargo install espflash

      - name: Build release binary
        run: |
          . $HOME/export-esp.sh
          cargo +esp check
          cargo +esp build --release
          VERSION=$(grep '^version =' Cargo.toml | head -n1 | cut -d'"' -f2)
          BIN_NAME="air-monitor-esp32s3-v${VERSION}.bin"
          espflash save-image --chip esp32s3 target/xtensa-esp32s3-espidf/release/air-monitor-rust "$BIN_NAME"
          echo "BIN_NAME=$BIN_NAME" >> $GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: air-monitor-firmware
          path: |
            air-monitor-esp32s3-v*.bin

  release:
    name: Create GitHub Release
    needs: build-firmware
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: air-monitor-firmware
          path: release_assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/air-monitor-esp32s3-v*.bin
          generate_release_notes: true
